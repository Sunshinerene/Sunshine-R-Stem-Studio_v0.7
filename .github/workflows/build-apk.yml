name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Abhängigkeiten installieren & Android-Projekt erzeugen
        run: |
          npm install
          npx cap add android

      - name: Mikrofon- & USB-MIDI-Rechte ins Manifest eintragen
        run: |
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            const perms = `
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-feature android:name="android.hardware.usb.host" android:required="false" />
            `;
            xml = xml.replace("<application", perms + "\n    <application");
            fs.writeFileSync(p, xml);
          '

      - name: Web-Assets synchronisieren & Debug-APK bauen
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK als Download-Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Sunshine-R-Stem-DAW-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
